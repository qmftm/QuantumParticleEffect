plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Mod Menu, only needed to compile the settings button. It is not required at runtime.
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"quantumparticleeffect" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// In-game test: ./gradlew runClientGameTest (opens a world and saves screenshots to build/run/clientGameTest/screenshots)
	configureTests {
		createSourceSet = true
		modId = "quantumparticleeffect-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu API for the settings button. Optional: the mod works without Mod Menu.
	clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Maven publishing. GitHub Actions runs `./gradlew publish` when a GitHub release is published
// (see .github/workflows/publish.yml). Run `./gradlew publishToMavenLocal` to test locally.
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = "quantumparticleeffect"
			from components.java

			pom {
				name = "Quantum Particle Effect"
				description = "Gives each potion effect its own particle texture."
				url = "https://github.com/qmftm/QuantumParticleEffect"
				licenses {
					license {
						name = "CC0-1.0"
						url = "https://creativecommons.org/publicdomain/zero/1.0/"
					}
				}
				scm {
					url = "https://github.com/qmftm/QuantumParticleEffect"
				}
			}
		}
	}

	repositories {
		maven {
			name = "GitHubPackages"
			url = "https://maven.pkg.github.com/qmftm/QuantumParticleEffect"
			credentials {
				username = System.getenv("GITHUB_ACTOR")
				password = System.getenv("GITHUB_TOKEN")
			}
		}
	}
}
